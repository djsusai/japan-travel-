      <span class="pin" style="background:${KIND_COLOR[s.kind]};width:30px;height:30px">${s.n}</span>
      <span class="tl-date">${s.date}</span>
      <span class="tl-title">${s.title}<small>${s.en}</small></span>
      <span class="tl-meta">${s.meta.map((t, i) => `<span class="tag ${i === 0 ? "tag-accent" : "tag-outline"}">${t}</span>`).join("")}</span>
    </button>
    <div class="tl-body">
      <p class="leg-note">${s.note}</p>
      <div class="facts">${s.facts.map(([k, v]) => `<div class="fact"><h5>${k}</h5><p>${v}</p></div>`).join("")}</div>
    </div>
  </article>`).join("");

function openStage(id, fromMap) {
  const row = document.getElementById(id);
  const wasActive = row.classList.contains("active");
  if (fromMap) document.querySelectorAll(".tl-row.active").forEach(r => {
    r.classList.remove("active"); r.querySelector(".tl-head").setAttribute("aria-expanded", "false");
  });
  const next = fromMap ? true : !wasActive;
  row.classList.toggle("active", next);
  row.querySelector(".tl-head").setAttribute("aria-expanded", String(next));
  d3.selectAll(".pinbadge circle.badge").attr("stroke", "#f5ead8").attr("stroke-width", 2.5);
  d3.select("#pin-" + id).select("circle.badge").attr("stroke", "#201e1d").attr("stroke-width", 3);
  if (fromMap) window.scrollTo({ top: row.getBoundingClientRect().top + window.scrollY - 24, behavior: "smooth" });
}
tl.addEventListener("click", e => {
  const b = e.target.closest(".tl-head");
  if (b) openStage(b.dataset.id, false);
});
const toggle = document.getElementById("toggleAll");
toggle.onclick = () => {
  const openAll = document.querySelectorAll(".tl-row.active").length < stages.length;
  document.querySelectorAll(".tl-row").forEach(r => {
    r.classList.toggle("active", openAll);
    r.querySelector(".tl-head").setAttribute("aria-expanded", String(openAll));
  });
  toggle.textContent = openAll ? "סגור את כל הפרטים" : "פתח את כל הפרטים";
};

/* ── map ──────────────────────────────────────────────────── */
const box = document.getElementById("mapbox");
let land = null, view = "japan";

const japanStages = stages.filter(s => s.at && s.at[1] > 120);
const worldStages = [stages[0], stages[1], stages[11], stages[12]];
const worldNodes = [
  { id:"s1",  key:"tlv", coord:[32.0004,34.8706],   label:"תל אביב", off:[0,-34] },
  { id:"s2",  key:"auh", coord:[24.4330,54.6511],   label:"אבו דאבי", off:[0,36] },
  { id:"s3",  key:"kix", coord:[34.4347,135.2328],  label:"אוסקה", off:[-46,32] },
  { id:"s12", key:"nrt", coord:[35.7719,140.3929],  label:"טוקיו", off:[46,-26] },
];

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  land = topojson.feature(topo, topo.objects.countries);
  render();
});

function render() {
  const w = Math.max(320, box.clientWidth);
  const h = view === "japan" ? Math.round(Math.min(620, Math.max(360, w * 0.58)))
                             : Math.round(Math.min(520, Math.max(300, w * 0.44)));
  box.innerHTML = "";
  if (!land) return;

  const nodes = view === "japan"
    ? japanStages.map(s => ({ id: s.id, coord: point(s), label: s.short, n: s.n, kind: s.kind, off: s.off }))
    : worldNodes.map(n => ({ ...n, n: "✈", kind: "flight" }));

  const fitGeo = { type: "MultiPoint", coordinates: nodes.map(n => ll(n.coord)) };
  const pad = view === "japan" ? 96 : 66;
  const proj = d3.geoMercator().fitExtent([[pad, pad + 10], [w - pad, h - pad - 20]], fitGeo);
  const path = d3.geoPath(proj);

  const svg = d3.select(box).append("svg")
    .attr("viewBox", `0 0 ${w} ${h}`).attr("width", w).attr("height", h)
    .attr("role", "img").attr("aria-label", "מפת מסלול הטיול");

  svg.append("rect").attr("width", w).attr("height", h).attr("fill", "#f9f4ed");
  svg.append("g").selectAll("path").data(land.features).join("path")
    .attr("d", path).attr("fill", "#e1eecc").attr("stroke", "#c0b6a5").attr("stroke-width", 0.8);

  const legs = svg.append("g");
  const drawLeg = (a, b, mode, via) => {
    const coords = via ? [ll(a), ll(via), ll(b)] : [ll(a), ll(b)];
    legs.append("path")
      .attr("d", path({ type: "LineString", coordinates: coords }))
      .attr("fill", "none").attr("stroke", COLORS[mode])
      .attr("stroke-width", mode === "flight" ? 2.5 : 3.6)
      .attr("stroke-linecap", "round")
      .attr("stroke-opacity", mode === "flight" ? .8 : .95)
      .attr("stroke-dasharray", mode === "flight" ? "7 9" : null);
  };

  if (view === "japan") {
    japanStages.forEach(s => { if (s.from && s.from[1] > 120 && s.at) drawLeg(s.from, s.at, s.mode || "car"); });
  } else {
    drawLeg([32.0004,34.8706], [24.4330,54.6511], "flight");
    drawLeg([24.4330,54.6511], [34.4347,135.2328], "flight");
    drawLeg([35.7719,140.3929], [24.4330,54.6511], "flight");
    legs.append("path").attr("d", path({ type:"LineString", coordinates:[ll([34.4347,135.2328]), ll([35.7719,140.3929])] }))
      .attr("fill","none").attr("stroke", COLORS.car).attr("stroke-width", 3.6).attr("stroke-linecap","round");
  }

  const g = svg.append("g");
  nodes.forEach(nd => {
    const [x, y] = proj(ll(nd.coord));
    const [dx, dy] = nd.off || [0, -34];
    const bx = x + dx, by = y + dy;
    const color = KIND_COLOR[nd.kind];
    g.append("line").attr("x1", x).attr("y1", y).attr("x2", bx).attr("y2", by)
      .attr("stroke", color).attr("stroke-width", 1.2).attr("stroke-opacity", .55);
    g.append("circle").attr("cx", x).attr("cy", y).attr("r", 3.6).attr("fill", color);

    const grp = g.append("g").attr("class", "pinbadge").attr("id", "pin-" + nd.id)
      .style("cursor", "pointer").on("click", () => openStage(nd.id, true));
    grp.append("title").text(nd.label);
    grp.append("circle").attr("class", "badge").attr("cx", bx).attr("cy", by).attr("r", 15)
      .attr("fill", color).attr("stroke", "#f5ead8").attr("stroke-width", 2.5);
    grp.append("text").attr("x", bx).attr("y", by).attr("text-anchor", "middle")
      .attr("dominant-baseline", "central").attr("fill", "#fff")
      .attr("font-family", "Heebo, sans-serif").attr("font-weight", 700).attr("font-size", 13)
      .attr("pointer-events", "none").text(nd.n);
    grp.append("text").attr("x", bx).attr("y", by + 28).attr("text-anchor", "middle")
      .attr("fill", "#2e2b25").attr("font-family", "Heebo, sans-serif")
      .attr("font-weight", 700).attr("font-size", 13.5)
      .attr("pointer-events", "none")
      .attr("paint-order", "stroke").attr("stroke", "#f9f4ed").attr("stroke-width", 4)
      .text(nd.label);
  });
}

document.getElementById("viewJapan").onclick = e => { view = "japan"; setViewBtns(); render(); };
document.getElementById("viewWorld").onclick = e => { view = "world"; setViewBtns(); render(); };
function setViewBtns() {
  document.getElementById("viewJapan").className = "btn " + (view === "japan" ? "btn-secondary" : "btn-ghost");
  document.getElementById("viewWorld").className = "btn " + (view === "world" ? "btn-secondary" : "btn-ghost");
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 160); });
</script>
</body>
</html>
